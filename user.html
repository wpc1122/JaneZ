<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>我的账号 · 张靓颖资料站</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">

<div class="auth-wrap user-wrap">
  <a class="auth-brand" href="index.html">
    <span class="brand-cn">张靓颖</span>
    <span class="brand-en">JANE&nbsp;ZHANG</span>
  </a>

  <!-- 账号信息卡 -->
  <div class="auth-card" id="accountCard">
    <div class="lgd-head">
      <span class="lgd-avatar" id="uAvatar">?</span>
      <div>
        <div class="lgd-name" id="uName">加载中…</div>
        <div class="lgd-role" id="uRole">—</div>
      </div>
    </div>
    <div class="u-facts" id="uFacts"></div>
    <div class="lgd-actions">
      <a class="btn lgd-btn" href="index.html">查看主站</a>
      <a class="btn lgd-btn" id="uAdminBtn" href="admin.html" style="display:none">进入管理端</a>
      <button class="btn lgd-btn danger" id="uLogout">退出登录</button>
    </div>
  </div>

  <!-- 建议窗口 -->
  <div class="auth-card">
    <h3 class="u-sug-title">给网站提建议</h3>
    <p class="auth-tip" style="margin:0 0 14px">欢迎就内容准确性、版面、功能等提出建议，管理员会查看并处理。</p>
    <form id="sugForm">
      <label class="auth-field">
        <span>建议内容（4–500 字）</span>
        <textarea id="sugBody" rows="4" maxlength="500" placeholder="例如：某张专辑信息有误 / 希望增加某板块…"></textarea>
      </label>
      <div class="auth-msg" id="sugMsg" role="alert"></div>
      <button type="submit" class="auth-submit" id="sugSubmit">提交建议</button>
    </form>
    <div class="u-sent" id="uSent"></div>
  </div>

  <a class="auth-back" href="index.html">← 返回主页</a>
</div>

<style>
.user-wrap { max-width: 480px; display: flex; flex-direction: column; gap: 18px; }
.u-sug-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
#sugBody { width: 100%; padding: 12px 14px; font-size: 14px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; outline: none; resize: vertical; font-family: inherit; transition: .2s var(--ease); }
#sugBody:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.u-facts { margin: 14px 0; }
.u-facts .fact-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.u-facts .fact-row:last-child { border-bottom: 0; }
.u-facts .fact-k { color: var(--muted); }
.u-facts .fact-v { color: var(--text); }
.u-sent { margin-top: 16px; }
.u-sent .us-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px; }
.u-sent .us-item .us-time { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
.auth-card { text-align: left; }
</style>

<script src="assets/js/auth.js"></script>
<script src="assets/js/user-page.js"></script>
</body>
</html>
