<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>登录 / 注册 · 张靓颖资料站</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <a class="auth-brand" href="index.html">
    <span class="brand-cn">张靓颖</span>
    <span class="brand-en">JANE&nbsp;ZHANG</span>
  </a>

  <div class="auth-card" id="authLoggedCard" style="display:none">
    <div class="lgd-head">
      <span class="lgd-avatar" id="lgdAvatar">?</span>
      <div>
        <div class="lgd-name" id="lgdName">—</div>
        <div class="lgd-role" id="lgdRole">普通用户</div>
      </div>
    </div>
    <p class="auth-tip" style="margin:14px 0">当前登录账号拥有对应权限。管理员可进入管理端编辑与查看建议。</p>
    <div class="lgd-actions">
      <a class="btn lgd-btn" href="index.html">查看主站</a>
      <a class="btn lgd-btn" href="user.html">我的账号 / 提建议</a>
      <a class="btn lgd-btn" id="lgdAdminBtn" href="admin.html" style="display:none">进入管理端</a>
      <button class="btn lgd-btn danger" id="lgdLogout">退出登录</button>
    </div>
  </div>

  <div class="auth-card" id="authFormCard">
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-tab="login" role="tab">登录</button>
      <button class="auth-tab" data-tab="register" role="tab">注册</button>
    </div>

    <form id="authForm" class="auth-form" autocomplete="on">
      <label class="auth-field">
        <span>用户名</span>
        <input type="text" id="authUser" name="user" required placeholder="用户名" autocomplete="username">
      </label>
      <label class="auth-field">
        <span>口令</span>
        <input type="password" id="authPass" name="pass" required placeholder="口令" autocomplete="current-password">
      </label>
      <label class="auth-field" id="authPass2Wrap" style="display:none">
        <span>确认口令</span>
        <input type="password" id="authPass2" name="pass2" required placeholder="再次输入口令" autocomplete="new-password">
      </label>
      <div class="auth-msg" id="authMsg" role="alert"></div>
      <button type="submit" class="auth-submit" id="authSubmit">登 录</button>
    </form>

    <p class="auth-tip">
      本站为静态站，账号与口令存于你的浏览器本地，口令经哈希加密后保存、不存明文。
      管理员可前往 <a href="admin.html" class="auth-link">管理端</a>。
    </p>
  </div>

  <a class="auth-back" href="index.html">← 返回主页</a>
</div>

<script src="assets/js/auth.js?v=2"></script>
<script src="assets/js/auth-page.js?v=2"></script>
</body>
</html>
